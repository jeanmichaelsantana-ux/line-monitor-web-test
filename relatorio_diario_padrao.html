<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatório Diário - Line Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:#102b4c;font-family:Arial,sans-serif}.top{display:flex;justify-content:flex-end;gap:10px;padding:10px 18px;background:#f4f8fb}.top button{border:0;border-radius:7px;background:#075da8;color:#fff;font-weight:700;padding:12px 18px}.sheet{max-width:1120px;margin:0 auto 20px;background:#fff}.head{background:linear-gradient(135deg,#063769,#075b97);color:#fff;padding:16px 28px 0}.langs{display:flex;gap:8px;margin-bottom:8px}.langs button{border:0;border-radius:20px;padding:8px 14px;font-weight:800}.headrow{display:flex;justify-content:space-between;gap:20px}.head h1{font-size:25px;margin:0}.head p{margin:3px 0 14px}.filters{display:grid;grid-template-columns:auto 170px;gap:7px;align-items:center;font-weight:700}.filters input,.filters select{padding:8px;border:1px solid #5680a4;border-radius:6px;background:#154d7e;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -28px}.stat{text-align:center;padding:9px;border-right:1px solid #3981b7;background:#0874b8;font-size:15px}.stat b{display:block;font-size:23px}.body{padding:16px 28px}.notice{background:#e9f7e9;border:1px solid #bfe6c4;color:#18823b;padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:13px}.summary{background:#eef7fd;border-left:4px solid #1494e8;padding:11px 16px;margin-bottom:15px}.card{border:1px solid #cbdde9;border-top:3px solid #1596e7;border-radius:7px;overflow:hidden}.cardhead{display:flex;align-items:center;gap:12px;background:#edf7fd;padding:10px 15px;font-weight:800}.tag{background:#0c8fd9;color:#fff;padding:5px 10px;border-radius:5px}.status{background:#c9f2cf;color:#168336;padding:5px 10px;border-radius:5px}.occno{margin-left:auto;color:#718399}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;padding:12px 16px;border-bottom:1px solid #dce8f0}.cell{padding:0 14px;border-right:1px solid #dce8f0}.cell:first-child{padding-left:0}.cell:last-child{border:0}.cell label,.media-title{display:block;color:#65788e;font-size:11px;font-weight:800;margin-bottom:5px}.desc{margin:0 16px 12px;border-left:4px solid #1596e7;padding:9px 13px;line-height:1.45}.mediawrap{padding:0 16px 16px}.media-grid{display:flex;gap:14px;flex-wrap:wrap}.media{width:190px}.media img,.media video{width:190px;height:145px;object-fit:contain;border:1px solid #cbdde9;border-radius:7px;background:#eef4f8}.media b{display:block;text-align:center;font-size:11px;margin-top:5px}.footer{text-align:center;color:#73849a;padding:18px;font-size:11px}@media(max-width:650px){.top{display:grid;grid-template-columns:1fr 1fr 1fr}.top button{padding:10px 5px;font-size:12px}.sheet{margin:0}.head{padding:14px 14px 0}.headrow{display:block}.filters{margin-bottom:12px}.stats{margin:0 -14px}.body{padding:12px}.grid{grid-template-columns:1fr}.cell{border:0;border-bottom:1px solid #e2ebf1;padding:8px 0}.media{width:46%}.media img,.media video{width:100%;height:130px}}@media print{.top,.notice{display:none}.sheet{max-width:none}.body{padding:10px}}</style>
</head>
<body>
<div class="top"><button onclick="shareReport()">↗ Compartilhar</button><button onclick="window.print()">▣ Salvar relatório</button><button onclick="history.back()">📁 Relatórios</button></div>
<div id="app"></div>
<script>
const D={pt:{title:'RELATÓRIO DE OCORRÊNCIAS DIÁRIAS',sub:'VD-Automação - Line Monitor',date:'Data:',shift:'Turno:',sum:'Resumo do turno:',occ:'Ocorrências',eq:'Equipamentos',tech:'Técnicos envolvidos',equipment:'EQUIPAMENTO',responsible:'TÉCNICOS RESPONSÁVEIS',time:'HORÁRIO',occurrence:'Ocorrência:',cause:'Causa identificada:',action:'Ação realizada:',photos:'FOTOS',videos:'VÍDEOS',saved:'Relatórios salvos somente neste dispositivo - Não enviados ao banco de dados'},en:{title:'DAILY OCCURRENCE REPORT',sub:'VD-Automation - Line Monitor',date:'Date:',shift:'Shift:',sum:'Shift summary:',occ:'Occurrences',eq:'Equipment',tech:'Technicians involved',equipment:'EQUIPMENT',responsible:'RESPONSIBLE TECHNICIANS',time:'TIME',occurrence:'Occurrence:',cause:'Identified cause:',action:'Action taken:',photos:'PHOTOS',videos:'VIDEOS',saved:'Reports saved only on this device - Not sent to database'},ko:{title:'일일 발생 보고서',sub:'VD-Automation - Line Monitor',date:'날짜:',shift:'교대:',sum:'교대 요약:',occ:'발생',eq:'설비',tech:'담당 기술자',equipment:'설비',responsible:'담당 기술자',time:'시간',occurrence:'발생:',cause:'원인:',action:'조치:',photos:'사진',videos:'동영상',saved:'보고서는 이 기기에만 저장되며 데이터베이스로 전송되지 않습니다'}};let lang='pt',x=null;try{x=JSON.parse(localStorage.getItem('line_monitor_ocorrencia_relatorio_diario')||'null')}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>{if(!v)return null;let d=new Date(v);return isNaN(d)?null:d};function media(){let a=Array.isArray(x?.evidencias)?x.evidencias:[];let fotos=a.filter(e=>!String(e.tipo||e.type||'').toLowerCase().includes('video')),vid=a.filter(e=>String(e.tipo||e.type||'').toLowerCase().includes('video'));let mk=(z,v)=>z.map((e,i)=>{let u=e.url||e.data||e.src||'';return u?'<div class="media">'+(v?'<video controls src="'+esc(u)+'"></video>':'<img src="'+esc(u)+'">')+'<b>EVIDÊNCIA '+(i+1)+'</b></div>':''}).join('');return '<div class="mediawrap"><span class="media-title">'+D[lang].photos+'</span><div class="media-grid">'+mk(fotos,false)+'</div>'+(vid.length?'<br><span class="media-title">'+D[lang].videos+'</span><div class="media-grid">'+mk(vid,true)+'</div>':'')+'</div>'}
function render(){let t=D[lang],a=dt(x?.inicio),b=dt(x?.fim),date=a?a.toLocaleDateString('pt-BR'):'-',time=(a?a.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'-')+(b?' até '+b.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):''),resp=x?.resp||x?.responsavel||'-',n=String(resp).split(/[,;]/).filter(Boolean).length||1;if(!x){app.innerHTML='<div class="sheet"><div class="body"><h2>Relatório não encontrado</h2><p>Volte ao Line Monitor e gere novamente.</p></div></div>';return}app.innerHTML='<div class="sheet"><div class="notice">🔒 '+t.saved+'</div><div class="head"><div class="langs"><button onclick="setLang(\'pt\')">🇧🇷 PT-BR</button><button onclick="setLang(\'en\')">🇺🇸 EN</button><button onclick="setLang(\'ko\')">🇰🇷 한국어</button></div><div class="headrow"><div><h1>'+t.title+'</h1><p>'+t.sub+'</p></div><div class="filters"><b>'+t.date+'</b><input value="'+esc(date)+'" readonly><b>'+t.shift+'</b><select><option>1º Turno</option><option>2º Turno</option><option>3º Turno</option></select></div></div><div class="stats"><div class="stat"><b>1</b>'+t.occ+'</div><div class="stat"><b>1</b>'+t.eq+'</div><div class="stat"><b>'+n+'</b>'+t.tech+'</div></div></div><div class="body"><div class="summary"><b>'+t.sum+'</b> 1 '+esc(x.tipo||'ocorrência')+' · '+esc(x.status||'-')+'</div><div class="card"><div class="cardhead"><span class="tag">'+esc((x.tipo||'-').toUpperCase())+'</span><span class="status">'+esc((x.status||'-').toUpperCase())+'</span><span>'+esc(x.linha||'-')+' - '+esc(x.equip||x.equipamento||'-')+'</span><span class="occno">Ocorrência #01</span></div><div class="grid"><div class="cell"><label>'+t.equipment+'</label><b>'+esc(x.equip||x.equipamento||'-')+'</b></div><div class="cell"><label>'+t.responsible+'</label><b>'+esc(resp)+'</b></div><div class="cell"><label>'+t.time+'</label><b>'+esc(time)+'</b></div></div><div class="desc"><b>'+t.occurrence+'</b> '+esc(x.ocorr||x.falha||x.descricao||'-')+'<br><b>'+t.cause+'</b> '+esc(x.causa||'-')+'<br><b>'+t.action+'</b> '+esc(x.acao||x.acao_realizada||'-')+'</div>'+media()+'</div></div><div class="footer">Relatório gerado automaticamente · Line Monitor · VD-Automação</div></div>'}
function setLang(v){lang=v;render()}async function shareReport(){try{if(navigator.share)await navigator.share({title:'Relatório Diário - Line Monitor',text:'Relatório Diário - '+(x?.linha||'')});else window.print()}catch(e){}}render();
</script></body></html>
