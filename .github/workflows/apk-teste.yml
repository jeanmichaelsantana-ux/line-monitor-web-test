name: APK de teste Line Monitor
on:
  workflow_dispatch:
  push:
    branches: [teste-apk-registrar-alteracao]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          test -d "$SDK/platforms/android-35" || "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Integrate existing Line Monitor interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          script=Path('app/src/main/assets/alteracoes-teste.js').read_text(encoding='utf-8')
          html=html.replace('</body>', '<script>'+script+'</script></body>')
          Path('app/src/main/assets/index.html').write_text(html,encoding='utf-8')
          PY
          for file in lino.js chat_historico.js report28_override.js lm_reliability.js connected40.js; do
            if [ -f "$file" ]; then cp "$file" app/src/main/assets/; fi
          done
      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LineMonitor-Teste-APK
          path: app/build/outputs/apk/debug/*.apk
