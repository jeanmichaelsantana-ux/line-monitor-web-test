name: Android build diagnostic (R37.1 branch)
on:
  workflow_dispatch:
  push:
    branches: [line-monitor-r37-1-teste]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "y" | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build current repository (diagnostic only)
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-diagnostic-build-not-r37-1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
