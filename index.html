<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Line Monitor Web</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f8;font:14px Arial;color:#17324d}header{background:#fff;padding:17px 22px;font-size:23px;font-weight:800;border-bottom:1px solid #d9e4ec}.wrap{max-width:1100px;margin:22px auto;padding:0 16px}.bar,.card{background:#fff;border-radius:13px;padding:16px;margin-bottom:15px;box-shadow:0 4px 16px #17324d12}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between}.badge{padding:7px 11px;border-radius:20px;background:#e6f5ec;color:#176b3a;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:700;display:block;margin:5px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8e2;border-radius:8px;background:#fff}textarea{min-height:70px}.full{grid-column:1/-1}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:#0b5cab;color:#fff}.btn2{background:#52677d}.danger{background:#a52b22}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2eaf0;font-size:13px}.muted{color:#64788b;font-size:12px}.empty{text-align:center;padding:25px;color:#64788b}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.bar{align-items:flex-start;flex-direction:column}table{display:block;overflow:auto}}</style></head><body>
<header>Line Monitor Web</header><div class="wrap"><div class="bar"><div><b>Versão Teste — Modo Corporativo Offline</b><div class="muted">Funciona sem Supabase. Os dados ficam somente neste navegador/PC.</div></div><span class="badge">OFFLINE ATIVO</span></div>
<div class="card"><h3>Nova ocorrência</h3><div class="grid">
<div><label>Linha</label><input id="linha" placeholder="VL01"></div><div><label>Equipamento</label><input id="equip" placeholder="ROBOT ASSEMBLY 01"></div>
<div><label>Tipo</label><select id="tipo"><option>Corretiva</option><option>Manutenção Preventiva</option><option>Material</option><option>Processo</option><option>Melhoria</option><option>8 System</option><option>Proativa</option></select></div>
<div><label>Status</label><select id="status"><option>Concluída</option><option>Pendente</option><option>Em acompanhamento</option></select></div>
<div><label>Início</label><input id="inicio" type="datetime-local"></div><div><label>Fim</label><input id="fim" type="datetime-local"></div>
<div class="full"><label>Ocorrência</label><textarea id="ocorr"></textarea></div><div class="full"><label>Causa</label><textarea id="causa"></textarea></div>
<div class="full"><label>Ação</label><textarea id="acao"></textarea></div><div class="full"><label>Responsável(is)</label><input id="resp" placeholder="Nome do técnico"></div></div>
<div class="actions"><button class="btn" onclick="salvar()">Salvar ocorrência</button><button class="btn btn2" onclick="exportar()">Exportar backup</button><label class="btn btn2" style="display:inline-block;margin:0">Importar backup<input type="file" accept=".json" onchange="importar(this)" style="display:none"></label></div></div>
<div class="card"><h3>Ocorrências salvas neste PC</h3><div id="lista"></div></div></div>
<script>
const KEY='line_monitor_corporativo_offline_v1';const $=id=>document.getElementById(id);
function dados(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function salvar(){const o={id:Date.now(),linha:$('linha').value.trim(),equipamento:$('equip').value.trim(),tipo:$('tipo').value,status:$('status').value,inicio:$('inicio').value,fim:$('fim').value,ocorrencia:$('ocorr').value.trim(),causa:$('causa').value.trim(),acao:$('acao').value.trim(),responsavel:$('resp').value.trim(),criado:new Date().toISOString()};if(!o.linha||!o.equipamento||!o.ocorrencia){alert('Preencha Linha, Equipamento e Ocorrência.');return}const a=dados();a.unshift(o);localStorage.setItem(KEY,JSON.stringify(a));['linha','equip','inicio','fim','ocorr','causa','acao','resp'].forEach(x=>$(x).value='');render()}
function apagar(id){if(!confirm('Excluir esta ocorrência deste PC?'))return;localStorage.setItem(KEY,JSON.stringify(dados().filter(x=>x.id!==id)));render()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const a=dados();if(!a.length){$('lista').innerHTML='<div class="empty">Nenhuma ocorrência salva neste PC.</div>';return}$('lista').innerHTML='<table><thead><tr><th>Linha</th><th>Equipamento</th><th>Tipo</th><th>Status</th><th>Ocorrência</th><th>Responsável</th><th></th></tr></thead><tbody>'+a.map(o=>'<tr><td>'+esc(o.linha)+'</td><td>'+esc(o.equipamento)+'</td><td>'+esc(o.tipo)+'</td><td>'+esc(o.status)+'</td><td>'+esc(o.ocorrencia)+'</td><td>'+esc(o.responsavel)+'</td><td><button class="btn danger" onclick="apagar('+o.id+')">Excluir</button></td></tr>').join('')+'</tbody></table>'}
function exportar(){const b=new Blob([JSON.stringify(dados(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='line-monitor-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}
function importar(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;localStorage.setItem(KEY,JSON.stringify(a));render();alert('Backup importado.')}catch{alert('Arquivo de backup inválido.')}};r.readAsText(f)}
render();</script></body></html>
