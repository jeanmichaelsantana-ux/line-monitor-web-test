<html lang="pt-BR">
<head>

  <title>Line Monitor Web</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f2f7fb;font-family:Arial,sans-serif}
    .load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#0b2545}
