<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Monitor — LS iG5A</title><style>body{font-family:Arial,sans-serif;background:#f2f7fb;color:#16334e;margin:0;padding:20px}main{max-width:750px;margin:auto}h1{font-size:23px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #b6c9d8;border-radius:10px;font-size:16px}details{background:white;margin:8px 0;border:1px solid #d7e3ee;border-radius:10px;padding:14px}summary{cursor:pointer;font-weight:bold}code{color:#0055a4;margin-right:12px}.kind{font-size:12px;color:#607c94;margin-left:8px}p{line-height:1.5}a{color:#0055a4}</style></head><body><main><a href="/">← Line Monitor</a><h1>LS Electric — iG5A</h1><p>Parâmetros e alarmes na mesma lista. Selecione um código para consultar a orientação técnica.</p><input id="q" aria-label="Pesquisar" placeholder="Pesquisar parâmetro ou alarme"><div id="list"></div><p><small>Referência de consulta. Confirme sempre o manual e a configuração da máquina antes de alterar parâmetros.</small></p></main><script>const data=[["ACC","Tempo de aceleração","Parâmetro"],["dEC","Tempo de desaceleração","Parâmetro"],["drv","Origem do comando de partida","Parâmetro"],["Frq","Origem da referência de frequência","Parâmetro"],["St1","Frequência predefinida 1","Parâmetro"],["St2","Frequência predefinida 2","Parâmetro"],["St3","Frequência predefinida 3","Parâmetro"],["F21","Frequência máxima","Parâmetro"],["F22","Frequência base","Parâmetro"],["F24","Habilitação dos limites de frequência","Parâmetro"],["F25","Limite superior de frequência","Parâmetro"],["F26","Limite inferior de frequência","Parâmetro"],["H30","Potência nominal do motor","Parâmetro"],["H31","Número de polos do motor","Parâmetro"],["H32","Escorregamento nominal","Parâmetro"],["H33","Corrente nominal do motor","Parâmetro"],["O.Ct","Sobrecorrente","Alarme"],["O.C2","Sobrecorrente 2","Alarme"],["G.Ft","Falha à terra","Alarme"]];const root=document.getElementById('list');function render(){const q=document.getElementById('q').value.toLowerCase();root.replaceChildren();for(const kind of ['Parâmetro','Alarme']){const matched=data.filter(r=>r[2]===kind&&r.join(' ').toLowerCase().includes(q));if(!matched.length)continue;const h=document.createElement('h2');h.textContent=kind==='Parâmetro'?'Parâmetros ('+matched.length+')':'Alarmes ('+matched.length+')';root.append(h);for(const [code,title] of matched){const d=document.createElement('details'),s=document.createElement('summary'),c=document.createElement('code'),t=document.createElement('span'),p=document.createElement('p');c.textContent=code;t.textContent=title;s.append(c,t);p.textContent=kind==='Alarme'?'O que verificar: condições elétricas, mecânicas e momento do disparo. O que fazer: corrigir a causa antes de resetar; seguir o procedimento de segurança.':'O que verificar: valor atual, placa do motor, entradas digitais e lógica do PLC. O que fazer: confirmar limites e procedimento aprovado antes de ajustar.';d.append(s,p);root.append(d)}}}document.getElementById('q').addEventListener('input',render);render();</script></body></html>
